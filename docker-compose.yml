services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TestDb: Data Source=/data/testplayer.db
    volumes:
      - testplayer-data:/data

volumes:
  testplayer-data:
